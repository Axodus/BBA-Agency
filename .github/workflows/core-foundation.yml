name: BBA Core Foundation

on:
  push:
    paths:
      - "core/**"
      - ".rag/development/**"
      - ".rag/adr/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/core-foundation.yml"
  pull_request:
    paths:
      - "core/**"
      - ".rag/development/**"
      - ".rag/adr/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/core-foundation.yml"

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck Core
        run: pnpm --dir core typecheck
      - name: Test Core
        run: pnpm --dir core test
      - name: Lint Core
        run: pnpm --dir core lint
      - name: Format check Core
        run: pnpm --dir core format:check
      - name: Core boundary check
        run: pnpm --dir core architecture
