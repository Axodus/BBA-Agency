$schema: https://json-schema.org/draft/2020-12/schema
$id: https://bba.country/schemas/delivery-content-1.0.yml
title: BBA Agency Informational Delivery Package
description: JSON Schema for canonical Delivery Packages. Required Markdown sections are checked by the repository validator.
type: object
additionalProperties: false
required: [schemaVersion, id, name, slug, route, category, status, operationalOnStaticSite, productId, productName, productRoute, projectId, projectName, projectRoute, eyebrow, headline, summary, purpose, customerOutcome, availability, prototype, seo, navigation, keywords, artifacts, reviewProcess, approval, revisionPolicy, versionHistory, traceability, qualityGates, limitations]
properties:
  schemaVersion: { const: '1.0' }
  id: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
  name: { type: string, minLength: 1 }
  slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
  route: { type: string, pattern: '^/deliveries/[a-z0-9-]+$' }
  category: { type: string, minLength: 1 }
  status: { enum: [PROTOTYPE_BACKED, ILLUSTRATIVE_PLANNED] }
  operationalOnStaticSite: { const: false }
  productId: { type: string }
  productName: { type: string, minLength: 1 }
  productRoute: { type: string, pattern: '^/services/' }
  projectId: { type: string }
  projectName: { type: string, minLength: 1 }
  projectRoute: { type: string, pattern: '^/projects/' }
  eyebrow: { type: string, minLength: 1 }
  headline: { type: string, minLength: 1 }
  summary: { type: string, minLength: 1 }
  purpose: { type: string, minLength: 1 }
  customerOutcome: { type: string, minLength: 1 }
  availability: { type: object, required: [code, label, operationalOnStaticSite], properties: { code: { enum: [PROTOTYPE_BACKED, ILLUSTRATIVE_PLANNED] }, label: { type: string }, operationalOnStaticSite: { const: false } } }
  prototype: { type: object, required: [available, disclosure], properties: { available: { type: boolean }, url: { type: string, format: uri }, disclosure: { type: string } } }
  seo: { type: object, required: [title, description, canonicalPath], properties: { title: { type: string }, description: { type: string }, canonicalPath: { type: string, pattern: '^/deliveries/' } } }
  navigation: { type: object, required: [previousDelivery, nextDelivery], properties: { previousDelivery: { type: [string, 'null'] }, nextDelivery: { type: [string, 'null'] } } }
  keywords: { type: array, minItems: 1, items: { type: string } }
  artifacts: { type: array, minItems: 1, items: { $ref: '#/$defs/artifact' } }
  reviewProcess: { type: array, minItems: 1, items: { $ref: '#/$defs/reviewCheckpoint' } }
  approval: { $ref: '#/$defs/approval' }
  revisionPolicy: { $ref: '#/$defs/revisionPolicy' }
  versionHistory: { type: array, minItems: 1, items: { $ref: '#/$defs/versionRecord' } }
  traceability: { type: array, minItems: 1, items: { $ref: '#/$defs/traceRecord' } }
  qualityGates: { type: array, minItems: 1, items: { $ref: '#/$defs/qualityGate' } }
  limitations: { type: array, minItems: 1, items: { type: string } }
$defs:
  artifact:
    type: object
    required: [id, name, description, purpose, artifactType, requiresHumanApproval, includedInPackage, illustrativeFormats]
    properties: { id: { type: string }, name: { type: string }, description: { type: string }, purpose: { type: string }, artifactType: { type: string }, requiresHumanApproval: { type: boolean }, includedInPackage: { const: true }, illustrativeFormats: { type: array, minItems: 1, items: { type: string } } }
  reviewCheckpoint:
    type: object
    required: [order, id, label, purpose, reviewerRole, artifactIds, possibleOutcomes, humanCheckpoint]
    properties: { order: { type: integer, minimum: 1 }, id: { type: string }, label: { type: string }, purpose: { type: string }, reviewerRole: { type: string }, artifactIds: { type: array, minItems: 1, items: { type: string } }, possibleOutcomes: { type: array, minItems: 2, items: { type: string } }, humanCheckpoint: { type: boolean } }
  approval:
    type: object
    required: [required, responsibleRole, description, possibleResponses, operationalOnStaticSite]
    properties: { required: { const: true }, responsibleRole: { type: string }, description: { type: string }, possibleResponses: { type: array, minItems: 3, items: { type: string } }, operationalOnStaticSite: { const: false } }
  revisionPolicy:
    type: object
    required: [description, preserves, mayInvalidate]
    properties: { description: { type: string }, preserves: { type: array, minItems: 1, items: { type: string } }, mayInvalidate: { type: array, minItems: 1, items: { type: string } } }
  versionRecord:
    type: object
    required: [version, status, description, changedArtifactIds, illustrative]
    properties: { version: { type: string }, status: { type: string }, description: { type: string }, changedArtifactIds: { type: array, minItems: 1, items: { type: string } }, decisionReference: { type: string }, illustrative: { const: true } }
  traceRecord:
    type: object
    required: [id, sourceType, sourceReference, artifactId, artifactVersion, rationale]
    properties: { id: { type: string }, sourceType: { type: string }, sourceReference: { type: string }, artifactId: { type: string }, artifactVersion: { type: string }, reviewCheckpointId: { type: string }, decisionReference: { type: string }, rationale: { type: string } }
  qualityGate:
    type: object
    required: [id, name, description, severityWhenFailed]
    properties: { id: { type: string }, name: { type: string }, description: { type: string }, severityWhenFailed: { enum: [WARNING, BLOCKING] } }
