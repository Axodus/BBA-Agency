$schema: https://json-schema.org/draft/2020-12/schema
$id: https://bba.country/schemas/project-content-1.0.yml
title: BBA Agency Informational Project Example
description: JSON Schema for canonical informational Project examples; Markdown sections are validated by the content-generation tool.
type: object
additionalProperties: false
required:
  - schemaVersion
  - id
  - name
  - slug
  - route
  - productId
  - productName
  - productRoute
  - category
  - exampleStatus
  - packageName
  - eyebrow
  - headline
  - summary
  - customerObjective
  - customerOutcome
  - audience
  - contentLanguage
  - applicationLanguage
  - availability
  - prototype
  - seo
  - navigation
  - relatedProductId
  - keywords
  - context
  - expectedOutcome
  - workflow
  - agentTeam
  - humanDecisions
  - revisionExample
  - deliverables
  - traceability
  - limitations
properties:
  schemaVersion: { const: '1.0' }
  id: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
  name: { type: string, minLength: 1 }
  slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
  route: { type: string, pattern: '^/projects/[a-z0-9-]+$' }
  productId: { enum: [bba-publisher, advertising-campaign, scientific-article, governance-proposal, market-research] }
  productName: { type: string, minLength: 1 }
  productRoute: { type: string, pattern: '^/services/[a-z0-9-]+$' }
  category: { type: string, minLength: 1 }
  exampleStatus: { enum: [PROTOTYPE_BACKED, ILLUSTRATIVE_PLANNED] }
  packageName: { type: string, minLength: 1 }
  eyebrow: { type: string, minLength: 1 }
  headline: { type: string, minLength: 1 }
  summary: { type: string, minLength: 1 }
  customerObjective: { type: string, minLength: 1 }
  customerOutcome: { type: string, minLength: 1 }
  audience: { type: array, minItems: 1, items: { type: string } }
  contentLanguage: { const: English }
  applicationLanguage: { const: English }
  availability:
    type: object
    required: [label, code, operationalOnStaticSite]
    properties:
      label: { type: string }
      code: { enum: [PROTOTYPE_BACKED, ILLUSTRATIVE_PLANNED] }
      operationalOnStaticSite: { const: false }
  prototype:
    type: object
    required: [available, disclosure]
    properties:
      available: { type: boolean }
      url: { type: string, format: uri }
      disclosure: { type: string, minLength: 1 }
  seo:
    type: object
    required: [title, description, canonicalPath]
    properties:
      title: { type: string }
      description: { type: string }
      canonicalPath: { type: string, pattern: '^/projects/' }
  navigation:
    type: object
    required: [previousProject, nextProject]
    properties:
      previousProject: { type: [string, 'null'] }
      nextProject: { type: [string, 'null'] }
  relatedProductId: { type: string }
  keywords: { type: array, minItems: 1, items: { type: string } }
  context: { type: object }
  expectedOutcome: { type: object }
  workflow: { type: array, minItems: 1, items: { type: object } }
  agentTeam: { type: object }
  humanDecisions: { type: array, minItems: 2, items: { type: object } }
  revisionExample: { type: object }
  deliverables: { type: array, minItems: 1, items: { type: object } }
  traceability: { type: array, minItems: 1, items: { type: object } }
  limitations: { type: array, minItems: 1, items: { type: string } }

# Versioning rules
# - schemaVersion 1.0 is the only supported version for this source set.
# - IDs and routes are stable public identifiers and must not be localized.
# - Structured cross-references are checked by static/tools/check-project-content.mjs.
