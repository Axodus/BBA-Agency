name: bba-api-local

services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - bba_api_mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval 'try { if (rs.status().ok === 1) quit(0) } catch (error) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]}) }'
          && mongosh --quiet --eval 'rs.status().ok' | grep -qx '1'
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  bba_api_mongo_data:
