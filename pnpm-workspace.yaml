packages:
  - apps/*
  - packages/*
  - core
  - transport/*
  - clients/*

# Build-script policy is explicit so installation remains reproducible without
# approving unrelated native dependency scripts.
ignoredBuiltDependencies:
  - onnxruntime-node
  - protobufjs
  - sharp
  - unrs-resolver
allowBuilds:
  esbuild: true
  msw: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  unrs-resolver: false
storeDir: .pnpm-store
