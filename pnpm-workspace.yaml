packages:
  - apps/*
  - packages/*
  - core
  - transport/*
  - clients/*
  - static

# These are legacy optional build scripts. M0 does not execute runtime or
# native dependency builds; the policy is explicit so plain `pnpm install`
# remains reproducible without approving unrelated scripts.
ignoredBuiltDependencies:
  - onnxruntime-node
  - protobufjs
  - sharp
  - unrs-resolver
allowBuilds:
  msw: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  unrs-resolver: false
storeDir: .pnpm-store
