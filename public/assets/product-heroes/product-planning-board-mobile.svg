    .bba-fill{fill:#fff;fill-opacity:.07;stroke:#fff;stroke-opacity:.22;stroke-width:1.2}
    .bba-dot{fill:#fff;fill-opacity:.32}
    .bba-faint{fill:#fff;fill-opacity:.05;stroke:#fff;stroke-opacity:.12;stroke-width:1}
  </style>

