    <path d="M830 142l-10-6v12z" fill="#fff" fill-opacity=".28" stroke="none"/>
    <path d="M545 266l-10-6v12z" fill="#fff" fill-opacity=".28" stroke="none"/>
    <path d="M1025 315l-10-6v12z" fill="#fff" fill-opacity=".28" stroke="none"/>
  </g>
  <g id="bba-planning-nodes">
    <circle cx="250" cy="220" r="8" class="bba-fill"/>
    <circle cx="380" cy="310" r="14" class="bba-fill"/>
    <circle cx="560" cy="266" r="9" class="bba-fill"/>
    <circle cx="735" cy="320" r="15" class="bba-fill"/>
