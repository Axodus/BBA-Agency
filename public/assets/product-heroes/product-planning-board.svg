<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" fill="none" role="presentation" aria-hidden="true" focusable="false">
  <title id="bba-product-planning-title">Decorative abstract planning board</title>
  
  <style>
    .bba-line{stroke:#fff;stroke-opacity:.28;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .bba-soft{stroke:#fff;stroke-opacity:.14;stroke-width:1}
    .bba-mid{stroke:#e8e8e8;stroke-opacity:.22;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
    .bba-fill{fill:#fff;fill-opacity:.07;stroke:#fff;stroke-opacity:.22;stroke-width:1.2}
    .bba-dot{fill:#fff;fill-opacity:.32}
    .bba-faint{fill:#fff;fill-opacity:.05;stroke:#fff;stroke-opacity:.12;stroke-width:1}
  </style>

